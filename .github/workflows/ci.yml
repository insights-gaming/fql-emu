name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The wasm artifact is only reproducible byte-for-byte with a fixed toolchain
# (see scripts/check-wasm-fresh.sh). Keep these in sync with the machine that
# builds the published artifact.
env:
  RUST_TOOLCHAIN: 1.95.0
  WASM_PACK_VERSION: v0.15.0
  BINARYEN_VERSION: '132'
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wasm-js:
    name: wasm build + js tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: ${{ env.WASM_PACK_VERSION }}
      - name: Build wasm (release)
        run: bash scripts/build-wasm.sh --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - working-directory: js
        run: npm ci
      - working-directory: js
        run: npm run typecheck
      - working-directory: js
        run: npm run build
      - working-directory: js
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: js/wasm/
          include-hidden-files: true

  wasm-fresh:
    name: wasm freshness
    needs: wasm-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: ${{ env.WASM_PACK_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Verify the artifact the wasm-js job built on another runner. js/wasm/
      # is gitignored, so this proves the build is reproducible; the same
      # script verifies a published (or committed) artifact.
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: js/wasm/
      - run: bash scripts/check-wasm-fresh.sh js/wasm
